[workspace.package]
authors    = [ "Ajuna Network <https://github.com/ajuna-network>" ]
edition    = "2021"
homepage   = "https://ajuna.io"
repository = "https://github.com/ajuna-network/ajuna-pallets"
version    = "0.15.0"

[workspace.metadata.psvm]
version = "polkadot-stable2409"

[workspace]
resolver = "2"
members = [
    "orml-pallets-benchmarking",
    "pallets/*",
    "pallets/ajuna-awesome-avatars/benchmarking",
    "pallets/ajuna-nft-staking/benchmarking",
    "primitives",
    "primitives/payment-handler",
    "sage/example-transition",
    "sage/pallet",
    "sage/api",
]

[workspace.lints.clippy]
manual_inspect = { level = "allow", priority = 2 }              # Needs substrate fix in `#[pallet]`
multiple_bound_locations = { level = "allow", priority = 2 }    # Needs substrate fix in `#[benchmark]`

[workspace.dependencies]
# General
bitvec = { version = "1.0.1", default-features = false }
hex = { version = "0.4.3", default-features = false }
log = { version = "0.4.17", default-features = false }

# Parity codec
parity-scale-codec = { version = "3.0.0", default-features = false }
scale-info         = { version = "2.1.1", default-features = false }

# Substrate
frame-benchmarking                         = { version = "38.0.0", default-features = false }
frame-support                              = { version = "38.2.0", default-features = false }
frame-system                               = { version = "38.0.0", default-features = false }
pallet-assets                              = { version = "40.0.0", default-features = false }
pallet-balances                            = { version = "39.0.0", default-features = false }
pallet-insecure-randomness-collective-flip = { version = "26.0.0", default-features = false }
pallet-nfts                                = { version = "32.0.0", default-features = false }
pallet-timestamp                           = { version = "37.0.0", default-features = false }
sp-arithmetic                              = { version = "26.0.0", default-features = false }
sp-core                                    = { version = "34.0.0", default-features = false }
sp-crypto-hashing                          = { version = "0.1.0", default-features = false }
sp-io                                      = { version = "38.0.0", default-features = false }
sp-runtime                                 = { version = "39.0.5", default-features = false }
sp-std                                     = { version = "14.0.0", default-features = false }

# orml
orml-vesting = { version = "1.2.1", default-features = false }

# Ajuna
ajuna-payment-handler                     = { path = "primitives/payment-handler", default-features = false }
ajuna-primitives                          = { path = "primitives", default-features = false }
pallet-ajuna-affiliates                   = { path = "pallets/ajuna-affiliates", default-features = false }
pallet-ajuna-awesome-avatars              = { path = "pallets/ajuna-awesome-avatars", default-features = false }
pallet-ajuna-battle-mogs                  = { path = "pallets/ajuna-battle-mogs", default-features = false }
pallet-ajuna-battle-royale                = { path = "pallets/ajuna-battle-royale", default-features = false }
pallet-ajuna-board                        = { path = "pallets/ajuna-board", default-features = false }
pallet-ajuna-matchmaker                   = { path = "pallets/ajuna-matchmaker", default-features = false }
pallet-ajuna-awesome-avatars-benchmarking = { path = "pallets/ajuna-awesome-avatars/benchmarking", default-features = false }
pallet-ajuna-nft-transfer                 = { path = "pallets/ajuna-nft-transfer", default-features = false }
pallet-ajuna-nft-staking                  = { path = "pallets/ajuna-nft-staking", default-features = false }
pallet-ajuna-seasons                      = { path = "pallets/ajuna-seasons", default-features = false }
pallet-ajuna-tournament                   = { path = "pallets/ajuna-tournament", default-features = false }
pallet-ajuna-wildcard                     = { path = "pallets/ajuna-wildcard", default-features = false }

# Sage
example-transition              = { path = "sage/example-transition", default-features = false }
pallet-sage                     = { path = "sage/pallet", default-features = false }
sage-api                        = { path = "sage/api", default-features = false }
